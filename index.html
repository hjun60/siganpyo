<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>방과 후 시간표</title>
    <style>
      :root {
        --print-width-cm: 8.7;
        --print-height-cm: 5.5;
        --border: #e2e4e9;
        --muted: #888;
        --radius: 10px;
        --topbar-h: 54px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", Arial, sans-serif;
        background: #f3f4f6;
        color: #111;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── 상단 바 ── */
      .topbar {
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        gap: 12px;
        flex-wrap: wrap;
      }
      .topbar-title { font-size: 15px; font-weight: 800; }
      .topbar-right {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .size-field {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .size-field input {
        width: 64px;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        font-size: 13px;
      }
      button {
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 8px;
        padding: 7px 13px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
        line-height: 1.2;
      }
      button.primary {
        background: #2563eb;
        border-color: #1d4ed8;
        color: #fff;
        font-weight: 700;
      }
      button:active { opacity: 0.8; }

      /* 저장 버튼 */
      button.save {
        background: #16a34a;
        border-color: #15803d;
        color: #fff;
        font-weight: 700;
        position: relative;
        transition: background 0.15s;
      }
      button.save:hover { background: #15803d; }
      button.save.dirty::after {
        content: "";
        position: absolute;
        top: 5px; right: 5px;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #fbbf24;
        border: 1.5px solid #fff;
      }

      /* 토스트 */
      .toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #1a1a2e;
        color: #fff;
        padding: 10px 22px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        opacity: 0;
        pointer-events: none;
        z-index: 9999;
        transition: opacity 0.2s, transform 0.2s;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 메인 2분할 ── */
      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── 왼쪽: 에디터 ── */
      .editor-panel {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .editor-hint {
        font-size: 12px;
        color: var(--muted);
        padding: 8px 12px;
        background: #fff;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        line-height: 1.6;
      }
      .editor-days {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        align-items: start;
      }
      .day-col {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .day-col-header {
        text-align: center;
        font-size: 14px;
        font-weight: 800;
        padding: 7px 4px;
        background: #fff;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        letter-spacing: 0.05em;
      }

      /* 이벤트 카드 */
      .event-card {
        background: #fff;
        border: 1.5px solid var(--border);
        border-left: 4px solid #ccc;
        border-radius: var(--radius);
        padding: 9px 10px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 6px;
      }
      .color-swatches {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        flex: 1;
      }
      .swatch {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        flex-shrink: 0;
        transition: transform 0.1s;
      }
      .swatch:hover { transform: scale(1.3); }
      .swatch.selected {
        border-color: #333;
        transform: scale(1.2);
        outline: 1px solid #fff;
        outline-offset: -3px;
      }
      .del-btn {
        border: none;
        background: none;
        color: #bbb;
        font-size: 16px;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .del-btn:hover { color: #e55; background: #fef2f2; }

      .card-field {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .card-field label {
        font-size: 10.5px;
        font-weight: 800;
        color: var(--muted);
        width: 24px;
        flex-shrink: 0;
        letter-spacing: 0.02em;
      }
      .card-field input {
        flex: 1;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
        padding: 5px 7px;
        font-size: 12.5px;
        background: #fafafa;
        min-width: 0;
      }
      .card-field input:focus {
        outline: none;
        border-color: #93c5fd;
        background: #fff;
      }
      .card-field input::placeholder { color: #c0c0c0; font-size: 11.5px; }

      /* 시간 드롭다운 */
      .time-selects {
        display: flex;
        align-items: center;
        gap: 3px;
        flex: 1;
        min-width: 0;
      }
      .time-select {
        flex: 1;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
        padding: 5px 3px;
        font-size: 11.5px;
        background: #fafafa;
        cursor: pointer;
        min-width: 0;
        color: #111;
        appearance: auto;
      }
      .time-select:focus {
        outline: none;
        border-color: #93c5fd;
        background: #fff;
      }
      .time-sep {
        font-size: 13px;
        color: #aaa;
        flex-shrink: 0;
        font-weight: 700;
      }

      .add-btn {
        width: 100%;
        border: 1.5px dashed #d1d5db;
        background: transparent;
        border-radius: var(--radius);
        padding: 8px;
        font-size: 13px;
        color: #9ca3af;
        cursor: pointer;
        text-align: center;
      }
      .add-btn:hover { background: #f9fafb; color: #6b7280; border-color: #9ca3af; }

      /* ── 오른쪽: 미리보기 ── */
      .preview-panel {
        width: calc(var(--print-width-cm) * 1cm + 52px);
        min-width: 200px;
        flex-shrink: 0;
        border-left: 1px solid var(--border);
        background: #f8f9fb;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 14px;
        gap: 8px;
        overflow-y: auto;
      }
      .preview-label-row {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
      }
      .preview-label-row span { font-weight: 400; }
      .sheet-frame {
        border: 1px dashed #c0c4cc;
        border-radius: 6px;
        background: #fff;
        padding: 3px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      }
      .sheet {
        width: calc(var(--print-width-cm) * 1cm);
        height: calc(var(--print-height-cm) * 1cm);
        background: #fff;
        display: grid;
        place-items: stretch;
        overflow: hidden;
      }

      /* ── 타임라인 ── */
      .timeline {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 9.5mm repeat(5, 1fr);
        grid-template-rows: auto repeat(27, 1fr);
        background: #fff;
      }
      .tl-head {
        font-size: 8pt;
        font-weight: 800;
        text-align: center;
        padding: 1mm 0.5mm;
        line-height: 1;
        user-select: none;
      }
      .tl-corner { grid-column: 1; grid-row: 1; }
      .tl-time {
        grid-column: 1;
        display: grid;
        place-items: center;
        font-size: 7.5pt;
        font-weight: 800;
        line-height: 1;
        user-select: none;
      }
      .tl-col {
        position: relative;
        grid-row: 2 / -1;
      }
      .tl-col-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: #fff;
      }
      .tl-event {
        position: absolute;
        left: 0; right: 0;
        border-radius: 3px;
        padding: 0.6mm 0.7mm;
        line-height: 1.05;
        overflow: hidden;
      }
      .tl-event .l1 {
        font-weight: 900;
        font-size: 7.5pt;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tl-event .l2 {
        font-weight: 600;
        font-size: 6.4pt;
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tl-event .l3 {
        font-weight: 600;
        font-size: 6pt;
        opacity: 0.85;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── 색상 ── */
      .bg-lunch        { background: #e6e6e6; }
      .bg-period       { background: #d9d9d9; }
      .bg-fit          { background: #fff2cc; }
      .bg-jump         { background: #cfe2f3; }
      .bg-ceramic      { background: #f9cb9c; }
      .bg-wise         { background: #ff4fa3; color: #fff; }
      .bg-sci          { background: #d9ead3; }
      .bg-chess        { background: #9fc5e8; }
      /* 추가 색상 */
      .bg-red-light    { background: #fee2e2; }
      .bg-red          { background: #fca5a5; }
      .bg-orange-light { background: #ffedd5; }
      .bg-amber        { background: #fde68a; }
      .bg-lime         { background: #d9f99d; }
      .bg-teal         { background: #99f6e4; }
      .bg-sky          { background: #bae6fd; }
      .bg-indigo       { background: #c7d2fe; }
      .bg-purple-light { background: #ede9fe; }
      .bg-purple       { background: #c4b5fd; }
      .bg-pink-light   { background: #fce7f3; }
      .bg-brown-light  { background: #e7d5bb; }
      .bg-dark-gray    { background: #6b7280; color: #fff; }
      .bg-dark-blue    { background: #1e40af; color: #fff; }
      .bg-dark-green   { background: #15803d; color: #fff; }
      .bg-none         { background: #ffffff; border: 0.3mm solid #eee; }

      /* ── 미리보기 클릭 커서 ── */
      .sheet-frame {
        cursor: zoom-in;
      }

      /* ── 팝업 모달 ── */
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(3px);
      }
      .modal-backdrop.open {
        display: flex;
      }
      .modal-box {
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 24px 64px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 90vw;
        max-height: 90vh;
        overflow: auto;
        position: relative;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .modal-title {
        font-size: 15px;
        font-weight: 800;
        color: #111;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .modal-close {
        border: none;
        background: #f3f4f6;
        border-radius: 8px;
        width: 32px;
        height: 32px;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        flex-shrink: 0;
      }
      .modal-close:hover { background: #e5e7eb; color: #111; }

      .modal-scale-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .modal-scale-row input[type=range] {
        width: 120px;
        accent-color: #2563eb;
      }
      .modal-scale-label {
        min-width: 36px;
        font-weight: 700;
        color: #333;
        font-size: 13px;
      }

      .modal-sheet-wrap {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow: auto;
        padding: 8px;
        background: #f3f4f6;
        border-radius: 10px;
      }
      .modal-sheet-inner {
        transform-origin: top left;
        box-shadow: 0 4px 24px rgba(0,0,0,0.15);
        border-radius: 4px;
        background: #fff;
        flex-shrink: 0;
      }
      .modal-sheet-inner .sheet {
        overflow: hidden;
      }

      /* ── 인쇄 ── */
      @media print {
        body { background: #fff; overflow: visible; height: auto; display: block; }
        .topbar, .editor-panel, .preview-panel { display: none !important; }
        .print-only { display: block !important; }
      }
      @page {
        size: calc(var(--print-width-cm) * 1cm) calc(var(--print-height-cm) * 1cm);
        margin: 0;
      }
      .print-only { display: none; }
    </style>
  </head>
  <body>
    <!-- 상단 바 -->
    <div class="topbar">
      <span class="topbar-title">방과 후 시간표</span>
      <div class="topbar-right">
        <div class="size-field">
          <span>가로</span>
          <input id="wCm" type="number" step="0.1" min="1" value="8.7" />
          <span>cm</span>
        </div>
        <div class="size-field">
          <span>세로</span>
          <input id="hCm" type="number" step="0.1" min="1" value="5.5" />
          <span>cm</span>
        </div>
        <button id="reset">초기화</button>
        <button class="save dirty" id="saveBtn">저장</button>
        <button class="primary" id="printBtn">프린트</button>
      </div>
    </div>

    <!-- 메인 -->
    <div class="main">
      <!-- 왼쪽: 에디터 -->
      <div class="editor-panel">
        <div class="editor-hint">
          각 항목을 <b>이름 / 교실 / 시간</b> 순서로 입력하세요.
          시간 형식: <code>13:00~14:20</code> &nbsp;|&nbsp; <code>종료 12:50</code> &nbsp;|&nbsp; <code>15:10~</code><br/>
          색상 동그라미를 클릭해 색을 바꾸고, <b>×</b> 버튼으로 삭제, <b>+ 추가</b>로 새 항목을 넣을 수 있어요.
        </div>
        <div class="editor-days" id="editorDays"></div>
      </div>

      <!-- 오른쪽: 미리보기 -->
      <div class="preview-panel">
        <div class="preview-label-row">
          <b>인쇄 미리보기</b>
          <span id="sizeLabel">8.7 × 5.5 cm</span>
        </div>
        <div class="sheet-frame">
          <div class="sheet" id="sheet">
            <div class="timeline" id="timeline"></div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--muted);text-align:center;line-height:1.6;">
          실제 인쇄 크기로 표시됩니다.<br/>
          내용 수정은 왼쪽 패널에서 하세요.
        </div>
      </div>
    </div>

    <!-- 확대 미리보기 모달 -->
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title">인쇄 미리보기 (확대)</span>
          <div class="modal-actions">
            <div class="modal-scale-row">
              <span>크기</span>
              <input type="range" id="modalScale" min="1" max="5" step="0.1" value="3" />
              <span class="modal-scale-label" id="modalScaleLabel">×3.0</span>
            </div>
            <button class="primary" id="modalPrintBtn">프린트</button>
            <button class="modal-close" id="modalClose" title="닫기">×</button>
          </div>
        </div>
        <div class="modal-sheet-wrap" id="modalSheetWrap">
          <div class="modal-sheet-inner" id="modalSheetInner">
            <div class="sheet" id="modalSheet">
              <div class="timeline" id="modalTimeline"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast" id="toast"></div>

    <!-- 인쇄 전용 -->
    <div class="print-only">
      <div class="sheet">
        <div class="timeline" id="printTimeline"></div>
      </div>
    </div>

    <script>
      /* ── 상수 / 색상 ── */
      const SCHEDULE_START = 12 * 60;
      const SCHEDULE_END = 16 * 60 + 30;
      const SLOT_MIN = 10;
      const SLOT_COUNT = (SCHEDULE_END - SCHEDULE_START) / SLOT_MIN; // 27

      const days = [
        { key: "mon", label: "월" },
        { key: "tue", label: "화" },
        { key: "wed", label: "수" },
        { key: "thu", label: "목" },
        { key: "fri", label: "금" },
      ];

      const COLORS = [
        // 기본
        { key: "bg-none",         hex: "#ffffff", label: "없음",    dark: false },
        { key: "bg-lunch",        hex: "#e6e6e6", label: "연회색",  dark: false },
        { key: "bg-period",       hex: "#d9d9d9", label: "회색",    dark: false },
        { key: "bg-dark-gray",    hex: "#6b7280", label: "진회색",  dark: true  },
        // 빨강 계열
        { key: "bg-red-light",    hex: "#fee2e2", label: "연빨강",  dark: false },
        { key: "bg-red",          hex: "#fca5a5", label: "빨강",    dark: false },
        { key: "bg-wise",         hex: "#ff4fa3", label: "진분홍",  dark: true  },
        { key: "bg-pink-light",   hex: "#fce7f3", label: "연분홍",  dark: false },
        // 주황/노랑 계열
        { key: "bg-orange-light", hex: "#ffedd5", label: "연주황",  dark: false },
        { key: "bg-ceramic",      hex: "#f9cb9c", label: "주황",    dark: false },
        { key: "bg-amber",        hex: "#fde68a", label: "노랑",    dark: false },
        { key: "bg-fit",          hex: "#fff2cc", label: "연노랑",  dark: false },
        { key: "bg-brown-light",  hex: "#e7d5bb", label: "베이지",  dark: false },
        // 초록 계열
        { key: "bg-lime",         hex: "#d9f99d", label: "연두",    dark: false },
        { key: "bg-sci",          hex: "#d9ead3", label: "연초록",  dark: false },
        { key: "bg-teal",         hex: "#99f6e4", label: "민트",    dark: false },
        { key: "bg-dark-green",   hex: "#15803d", label: "진초록",  dark: true  },
        // 파랑 계열
        { key: "bg-sky",          hex: "#bae6fd", label: "하늘",    dark: false },
        { key: "bg-jump",         hex: "#cfe2f3", label: "연하늘",  dark: false },
        { key: "bg-chess",        hex: "#9fc5e8", label: "파랑",    dark: false },
        { key: "bg-dark-blue",    hex: "#1e40af", label: "진파랑",  dark: true  },
        // 보라 계열
        { key: "bg-indigo",       hex: "#c7d2fe", label: "남색",    dark: false },
        { key: "bg-purple-light", hex: "#ede9fe", label: "연보라",  dark: false },
        { key: "bg-purple",       hex: "#c4b5fd", label: "보라",    dark: false },
      ];

      /* ── 초기 데이터 ── */
      function defaultEvents() {
        return [
          { id: "mon-lunch",   day: "mon", color: "bg-lunch",   name: "점심시간",                    place: "",           time: "종료 12:50" },
          { id: "mon-history", day: "mon", color: "bg-fit",     name: "맞춤형교실 역사놀이",         place: "맞춤형2실",  time: "13:00~14:20" },
          { id: "mon-jump",    day: "mon", color: "bg-jump",    name: "음악줄넘기",                  place: "체육관",     time: "14:30~15:20" },
          { id: "tue-lunch",   day: "tue", color: "bg-lunch",   name: "점심시간",                    place: "",           time: "" },
          { id: "tue-5",       day: "tue", color: "bg-period",  name: "5교시",                       place: "",           time: "종료 13:30" },
          { id: "tue-ceramic", day: "tue", color: "bg-ceramic", name: "도예A",                       place: "과학실2",    time: "13:40~15:00" },
          { id: "tue-wise",    day: "tue", color: "bg-wise",    name: "와이즈만 수학",               place: "",           time: "15:10~" },
          { id: "wed-lunch",   day: "wed", color: "bg-lunch",   name: "점심시간",                    place: "",           time: "종료 12:50" },
          { id: "wed-art",     day: "wed", color: "bg-fit",     name: "맞춤형교실 미술공작",         place: "맞춤형2실",  time: "13:00~14:20" },
          { id: "thu-lunch",   day: "thu", color: "bg-lunch",   name: "점심시간",                    place: "",           time: "" },
          { id: "thu-5",       day: "thu", color: "bg-period",  name: "5교시",                       place: "",           time: "종료 13:30" },
          { id: "thu-world",   day: "thu", color: "bg-fit",     name: "맞춤형교실 세계문화",         place: "맞춤형2실",  time: "13:40~15:00" },
          { id: "thu-sci",     day: "thu", color: "bg-sci",     name: "목요과학실험B",               place: "과학실2",    time: "15:10~16:30" },
          { id: "fri-lunch",   day: "fri", color: "bg-lunch",   name: "점심시간",                    place: "",           time: "" },
          { id: "fri-5",       day: "fri", color: "bg-period",  name: "5교시",                       place: "",           time: "종료 13:30" },
          { id: "fri-board",   day: "fri", color: "bg-fit",     name: "맞춤형교실 보드게임&창의수학", place: "맞춤형2실",  time: "13:40~15:00" },
          { id: "fri-chess",   day: "fri", color: "bg-chess",   name: "체스B",                       place: "4-3반(4층)", time: "15:10~16:30" },
        ];
      }

      let events = defaultEvents();
      let uidCounter = 200;

      /* ── 에디터 렌더링 ── */
      function renderEditor() {
        const editorDays = document.getElementById("editorDays");
        editorDays.innerHTML = "";
        days.forEach((d) => {
          const col = document.createElement("div");
          col.className = "day-col";

          const hdr = document.createElement("div");
          hdr.className = "day-col-header";
          hdr.textContent = d.label;
          col.appendChild(hdr);

          events
            .filter((e) => e.day === d.key)
            .forEach((e) => col.appendChild(buildCard(e)));

          const addBtn = document.createElement("button");
          addBtn.className = "add-btn";
          addBtn.textContent = "+ 추가";
          addBtn.addEventListener("click", () => {
            events.push({ id: `${d.key}-${++uidCounter}`, day: d.key, color: "bg-fit", name: "", place: "", time: "" });
            markDirty();
            renderEditor();
            renderPreview();
          });
          col.appendChild(addBtn);

          editorDays.appendChild(col);
        });
      }

      function buildCard(e) {
        const colorInfo = COLORS.find((c) => c.key === e.color) || COLORS[1];

        const card = document.createElement("div");
        card.className = "event-card";
        card.style.borderLeftColor = colorInfo.hex === "#ffffff" ? "#ccc" : colorInfo.hex;

        /* 상단: 색상 선택 + 삭제 */
        const top = document.createElement("div");
        top.className = "card-top";

        const swatches = document.createElement("div");
        swatches.className = "color-swatches";
        COLORS.forEach((c) => {
          const sw = document.createElement("div");
          sw.className = "swatch" + (c.key === e.color ? " selected" : "");
          sw.style.background = c.hex;
          const isSelected = c.key === e.color;
          sw.style.border = "2px solid " + (isSelected ? (c.dark ? "#fff" : "#333") : (c.hex === "#ffffff" ? "#ccc" : "transparent"));
          if (isSelected && c.dark) sw.style.outlineColor = "#333";
          sw.title = c.label;
          sw.addEventListener("click", () => {
            const idx = events.findIndex((x) => x.id === e.id);
            if (idx < 0) return;
            events[idx].color = c.key;
            markDirty();
            renderEditor();
            renderPreview();
          });
          swatches.appendChild(sw);
        });
        top.appendChild(swatches);

        const del = document.createElement("button");
        del.className = "del-btn";
        del.textContent = "×";
        del.title = "삭제";
        del.addEventListener("click", () => {
          events = events.filter((x) => x.id !== e.id);
          markDirty();
          renderEditor();
          renderPreview();
        });
        top.appendChild(del);
        card.appendChild(top);

        /* 입력 필드: 이름 / 교실 */
        ["이름|name|예) 역사놀이", "교실|place|예) 맞춤형2실"].forEach((spec) => {
          const [label, field, placeholder] = spec.split("|");
          const row = document.createElement("div");
          row.className = "card-field";
          const lbl = document.createElement("label");
          lbl.textContent = label;
          row.appendChild(lbl);
          const inp = document.createElement("input");
          inp.type = "text";
          inp.value = e[field];
          inp.placeholder = placeholder;
          inp.addEventListener("input", () => {
            const idx = events.findIndex((x) => x.id === e.id);
            if (idx < 0) return;
            events[idx][field] = inp.value;
            markDirty();
            renderPreview();
          });
          row.appendChild(inp);
          card.appendChild(row);
        });

        /* 시간 필드: 드롭다운(10분 단위) */
        {
          const row = document.createElement("div");
          row.className = "card-field";
          const lbl = document.createElement("label");
          lbl.textContent = "시간";
          row.appendChild(lbl);

          // 기존 시간 텍스트 파싱 → 드롭다운 초기값
          const { start: parsedStart, end: parsedEnd } = extractStartEnd(e.time);
          const initStart = minutesToTimeStr(clamp(parsedStart));
          const initEnd   = minutesToTimeStr(clamp(parsedEnd));

          const wrap = document.createElement("div");
          wrap.className = "time-selects";

          const startSel = buildTimeSelect(initStart, "시작");
          const sep = document.createElement("span");
          sep.className = "time-sep";
          sep.textContent = "~";
          const endSel = buildTimeSelect(initEnd, "종료");

          function onTimeChange() {
            const idx = events.findIndex((x) => x.id === e.id);
            if (idx < 0) return;
            events[idx].time = formatTimeText(startSel.value, endSel.value);
            markDirty();
            renderPreview();
          }
          startSel.addEventListener("change", onTimeChange);
          endSel.addEventListener("change", onTimeChange);

          wrap.appendChild(startSel);
          wrap.appendChild(sep);
          wrap.appendChild(endSel);
          row.appendChild(wrap);
          card.appendChild(row);
        }

        return card;
      }

      /* ── 미리보기 렌더링 ── */
      /* ── 시간 드롭다운 헬퍼 ── */
      function generateTimeOptions() {
        const opts = [];
        for (let m = SCHEDULE_START; m <= SCHEDULE_END; m += SLOT_MIN) {
          const h = String(Math.floor(m / 60)).padStart(2, "0");
          const mm = String(m % 60).padStart(2, "0");
          opts.push(`${h}:${mm}`);
        }
        return opts;
      }
      const TIME_OPTIONS = generateTimeOptions(); // ["12:00","12:10",...,"16:30"]

      function minutesToTimeStr(min) {
        if (min == null) return "";
        const h = String(Math.floor(min / 60)).padStart(2, "0");
        const m = String(min % 60).padStart(2, "0");
        return `${h}:${m}`;
      }

      function formatTimeText(startVal, endVal) {
        if (startVal && endVal) return `${startVal}~${endVal}`;
        if (startVal) return `${startVal}~`;
        if (endVal) return `~${endVal}`;
        return "";
      }

      function buildTimeSelect(selectedVal, placeholder) {
        const sel = document.createElement("select");
        sel.className = "time-select";
        const none = document.createElement("option");
        none.value = "";
        none.textContent = placeholder;
        sel.appendChild(none);
        TIME_OPTIONS.forEach((t) => {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t;
          if (t === selectedVal) opt.selected = true;
          sel.appendChild(opt);
        });
        return sel;
      }

      function escapeHtml(str) {
        return String(str || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function buildLineHtml(name, place, time) {
        const parts = [];
        if (name)  parts.push(`<div class="l1">${escapeHtml(name)}</div>`);
        if (place) parts.push(`<div class="l2">${escapeHtml(place)}</div>`);
        if (time)  parts.push(`<div class="l3">${escapeHtml(time)}</div>`);
        return parts.join("");
      }

      function parseTimeToMinutes(str) {
        const m = /^(\d{1,2}):(\d{2})$/.exec((str || "").trim());
        if (!m) return null;
        return Number(m[1]) * 60 + Number(m[2]);
      }

      function extractStartEnd(text) {
        const t = (text || "").replace(/\s+/g, " ").trim();
        if (!t) return { start: null, end: null };
        let m;
        // 13:00~14:20
        m = /(\d{1,2}:\d{2})\s*[~\-–]\s*(\d{1,2}:\d{2})/.exec(t);
        if (m) return { start: parseTimeToMinutes(m[1]), end: parseTimeToMinutes(m[2]) };
        // 15:10~
        m = /(\d{1,2}:\d{2})\s*[~\-–]\s*$/.exec(t);
        if (m) return { start: parseTimeToMinutes(m[1]), end: null };
        // ~13:30
        m = /^[~\-–]\s*(\d{1,2}:\d{2})/.exec(t);
        if (m) return { start: null, end: parseTimeToMinutes(m[1]) };
        // 종료 12:50
        m = /종료\s*(\d{1,2}:\d{2})/.exec(t);
        if (m) return { start: null, end: parseTimeToMinutes(m[1]) };
        return { start: null, end: null };
      }

      function clamp(min) {
        if (min == null) return null;
        return Math.min(SCHEDULE_END, Math.max(SCHEDULE_START, min));
      }

      function resolveDay(dayKey) {
        const arr = events
          .filter((e) => e.day === dayKey)
          .map((e) => {
            const { start, end } = extractStartEnd(e.time);
            return { ...e, _s: clamp(start), _e: clamp(end) };
          })
          .sort((a, b) => {
            const as = a._s ?? Infinity, bs = b._s ?? Infinity;
            if (as !== bs) return as - bs;
            return (a._e ?? Infinity) - (b._e ?? Infinity);
          });

        let cursor = SCHEDULE_START;
        for (const e of arr) {
          if (e._s == null) e._s = cursor;
          if (e._e == null) e._e = SCHEDULE_END;
          if (e._e < e._s) e._e = e._s;
          cursor = e._e;
        }
        return arr;
      }

      function buildSkeleton(container) {
        container.innerHTML = "";

        // 모서리
        const corner = document.createElement("div");
        corner.className = "tl-head tl-corner";
        container.appendChild(corner);

        // 요일 헤더
        days.forEach((d, i) => {
          const h = document.createElement("div");
          h.className = "tl-head";
          h.style.cssText = `grid-column:${i + 2};grid-row:1`;
          h.textContent = d.label;
          container.appendChild(h);
        });

        // 시간 레이블
        [
          { label: "12", s: 0,  n: 6 },
          { label: "13", s: 6,  n: 6 },
          { label: "14", s: 12, n: 6 },
          { label: "15", s: 18, n: 6 },
          { label: "16", s: 24, n: 3 },
        ].forEach(({ label, s, n }) => {
          const t = document.createElement("div");
          t.className = "tl-time";
          t.style.gridRow = `${2 + s} / ${2 + s + n}`;
          t.textContent = label;
          container.appendChild(t);
        });

        // 요일 컬럼
        days.forEach((d, i) => {
          const col = document.createElement("div");
          col.className = "tl-col";
          col.style.gridColumn = String(i + 2);
          col.dataset.dayKey = d.key;
          const bg = document.createElement("div");
          bg.className = "tl-col-bg";
          col.appendChild(bg);
          container.appendChild(col);
        });
      }

      function slotTop(colEl, slotIdx) {
        return (colEl.getBoundingClientRect().height * slotIdx) / SLOT_COUNT;
      }

      function minToSlot(min) {
        return Math.round(((clamp(min) ?? SCHEDULE_START) - SCHEDULE_START) / SLOT_MIN);
      }

      function drawEvents(container) {
        container.querySelectorAll(".tl-event").forEach((n) => n.remove());
        days.forEach((d) => {
          const col = container.querySelector(`.tl-col[data-day-key="${d.key}"]`);
          if (!col) return;
          resolveDay(d.key).forEach((e) => {
            const ev = document.createElement("div");
            ev.className = `tl-event ${e.color || ""}`;
            ev.innerHTML = buildLineHtml(e.name, e.place, e.time);
            const top    = slotTop(col, minToSlot(e._s));
            const bottom = slotTop(col, minToSlot(e._e));
            ev.style.top    = `${top}px`;
            ev.style.height = `${Math.max(6, bottom - top)}px`;
            col.appendChild(ev);
          });
        });
      }

      function renderPreview() {
        const tl  = document.getElementById("timeline");
        const ptl = document.getElementById("printTimeline");
        buildSkeleton(tl);
        buildSkeleton(ptl);
        requestAnimationFrame(() => {
          drawEvents(tl);
          drawEvents(ptl);
        });
      }

      /* ── 로컬 스토리지 ── */
      const STORAGE_KEY = "siganpyo_v1";
      let isDirty = false;

      function markDirty() {
        isDirty = true;
        document.getElementById("saveBtn").classList.add("dirty");
      }

      function markClean() {
        isDirty = false;
        document.getElementById("saveBtn").classList.remove("dirty");
      }

      function showToast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 2200);
      }

      function saveToStorage() {
        try {
          const wCm = document.getElementById("wCm").value;
          const hCm = document.getElementById("hCm").value;
          const payload = { events, wCm, hCm, savedAt: Date.now() };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          markClean();
        } catch (_) {}
      }

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const payload = JSON.parse(raw);
          if (!Array.isArray(payload.events)) return null;
          return payload;
        } catch (_) { return null; }
      }

      /* ── 인쇄 크기 ── */
      function setPrintSize(w, h, skipSave) {
        const ws = (+w > 0 && isFinite(+w)) ? +w : 8.7;
        const hs = (+h > 0 && isFinite(+h)) ? +h : 5.5;
        document.documentElement.style.setProperty("--print-width-cm", ws);
        document.documentElement.style.setProperty("--print-height-cm", hs);
        document.getElementById("wCm").value = ws;
        document.getElementById("hCm").value = hs;
        const lbl = `${ws} × ${hs} cm`;
        document.getElementById("sizeLabel").textContent = lbl;
        document.querySelector(".preview-panel").style.width =
          `calc(${ws}cm + 52px)`;
        renderPreview();
        if (!skipSave) saveToStorage();
      }

      /* ── 이벤트 바인딩 ── */
      document.getElementById("wCm").addEventListener("input", (e) => {
        setPrintSize(e.target.value, document.getElementById("hCm").value);
        markDirty();
      });
      document.getElementById("hCm").addEventListener("input", (e) => {
        setPrintSize(document.getElementById("wCm").value, e.target.value);
        markDirty();
      });

      document.getElementById("reset").addEventListener("click", () => {
        if (!confirm("초기화하면 저장된 내용이 모두 지워집니다. 계속할까요?")) return;
        events = defaultEvents();
        localStorage.removeItem(STORAGE_KEY);
        markClean();
        renderEditor();
        setPrintSize(8.7, 5.5, true);
        showToast("초기화되었습니다.");
      });

      document.getElementById("saveBtn").addEventListener("click", () => {
        saveToStorage();
        renderPreview();
        showToast("✓ 저장되었습니다!");
      });

      document.getElementById("printBtn").addEventListener("click", () => {
        renderPreview();
        setTimeout(() => window.print(), 120);
      });

      /* ── 확대 미리보기 모달 ── */
      const modalBackdrop  = document.getElementById("modalBackdrop");
      const modalSheetInner = document.getElementById("modalSheetInner");
      const modalScaleSlider = document.getElementById("modalScale");
      const modalScaleLabel  = document.getElementById("modalScaleLabel");

      function applyModalScale() {
        const scale = parseFloat(modalScaleSlider.value);
        modalScaleLabel.textContent = `×${scale.toFixed(1)}`;
        const ws = parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--print-width-cm")) || 8.7;
        const hs = parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--print-height-cm")) || 5.5;
        // 1cm ≈ 37.8px
        const PX_PER_CM = 37.8;
        const w = ws * PX_PER_CM * scale;
        const h = hs * PX_PER_CM * scale;
        // sheet 크기를 px로 직접 지정 (cm 단위 CSS 변수에 독립)
        const sheet = document.getElementById("modalSheet");
        sheet.style.width  = `${w}px`;
        sheet.style.height = `${h}px`;
        modalSheetInner.style.width  = `${w}px`;
        modalSheetInner.style.height = `${h}px`;
        // 이벤트 재배치 (크기 변경 후 높이 계산 필요)
        requestAnimationFrame(() => {
          const mtl = document.getElementById("modalTimeline");
          drawEvents(mtl);
        });
      }

      function openModal() {
        const mtl = document.getElementById("modalTimeline");
        buildSkeleton(mtl);
        modalBackdrop.classList.add("open");
        // 레이아웃 안정 후 scale 적용
        requestAnimationFrame(() => applyModalScale());
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
      }

      // 미리보기 클릭 → 모달
      document.querySelector(".sheet-frame").addEventListener("click", openModal);

      // 닫기 버튼 / 배경 클릭
      document.getElementById("modalClose").addEventListener("click", closeModal);
      modalBackdrop.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) closeModal();
      });

      // ESC 키
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // 슬라이더
      modalScaleSlider.addEventListener("input", applyModalScale);

      // 모달에서 프린트
      document.getElementById("modalPrintBtn").addEventListener("click", () => {
        renderPreview();
        setTimeout(() => window.print(), 120);
      });

      /* ── 초기화: 저장된 데이터 우선 복원 ── */
      (function init() {
        const saved = loadFromStorage();
        if (saved) {
          events = saved.events;
          events.forEach((e) => {
            const n = parseInt((e.id || "").split("-").pop(), 10);
            if (!isNaN(n) && n >= uidCounter) uidCounter = n + 1;
          });
          renderEditor();
          setPrintSize(saved.wCm ?? 8.7, saved.hCm ?? 5.5, true);
        } else {
          renderEditor();
          setPrintSize(8.7, 5.5, true);
        }
        markClean(); // 불러온 직후는 저장된 상태
      })();
    </script>
  </body>
</html>
